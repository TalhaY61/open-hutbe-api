name: Weekly Hutbe Update

on:
  schedule:
    # Runs Thursday late UTC in case Diyanet publishes early.
    - cron: '30 22,23 * * 4'
    # Runs every Friday at 07:00 and 10:00 UTC as a fallback.
    - cron: '0 7,10 * * 5'
  workflow_dispatch: # Allows manual trigger

concurrency:
  group: weekly-hutbe-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-hutbes:
    # Keep OS upgrades explicit instead of following ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          check-latest: true
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Scraper Compatibility
        run: python -m unittest discover -s tests -v

      - name: Run Scraper Bot
        run: python scripts/scraper.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'Hutbe Bot'
          git config --global user.email 'bot@noreply.github.com'
          
          git add -- hutbes.json prayers.json pdfs docs
          
          if git diff --staged --quiet; then
            echo "No changes to commit. Workflow finished."
          else
            git commit -m "Hutbe Bot: Update hutbes for $(date +'%Y-%m-%d')"
            git push
          fi
